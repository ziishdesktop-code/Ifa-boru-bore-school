<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login - Ifa Boru Bore School</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <div class="logo-area">

        <img src="images/logo.jpg"
             alt="Ifa Boru Bore School Logo">

        <h1>Ifa Boru Bore School</h1>

    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="academics.html">Academics</a>
        <a href="registration.html">Registration</a>
        <a href="results.html">Results</a>
        <a href="notifications.html">Notifications</a>
        <a href="library.html">Library</a>
        <a href="ai.html">AI Assistant</a>
        <a href="contact.html">Contact</a>
    </nav>

</header>


<main>

<section class="login-section">

    <div class="login-box">

        <h2>👨‍🎓 Student Login</h2>

        <p>
            Login to access your student dashboard.
        </p>


        <form id="loginForm">

            <label for="loginEmail">
                Email Address
            </label>

            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email"
                required
            >


            <label for="loginPassword">
                Password
            </label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
                required
            >


            <button
                type="submit"
                class="submit-button">
                Login
            </button>

        </form>


        <p class="login-register">
            Don't have an account?
            <a href="signup.html">Register here</a>
        </p>

    </div>

</section>

</main>


<footer>

    <p>
        © <span id="year">2026</span>
        Ifa Boru Bore School.
        All Rights Reserved.
    </p>

</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabaseClient.js"></script>

<script src="login.js"></script>

</body>
</html>
